# mkdocs.yml template (English): generated by genera_sito.py with LINGUA=en.
# Do not edit mkdocs.yml by hand.
site_name: Algorithms · Fabio Furini
site_description: >-
  Algorithms: the course lecture notes online, with pseudo-code and C++ code,
  definitions, theorems and proofs, worked examples and exercises with solutions.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/algorithms/
repo_url: https://github.com/fabiofurini/algorithms
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/algorithms/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/code-braces
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/operations-research-lab/
      name: Operations Research Lab
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/mip-modelling/
      name: MIP Modelling
    - icon: material/math-integral
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      name: Mathematical Analysis 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/linear-algebra/
      name: Linear Algebra
    - icon: material/chart-bell-curve
      link: https://fabiofurini.github.io/convex-optimization/
      name: Convex Optimization
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/linear-programming/
      name: Linear Programming
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/algoritmi/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/algorithms/
      lang: en

extra_css:
  - stylesheets/extra.css?v=68f743ff1a
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=c4336c2fb4

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=630f96bc3b
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  # grafici interattivi: JSXGraph, il motore, poi le ricette (gi-*.js, le aggiunge genera_sito.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=6e596bae66
  - javascripts/gi-cap1-6.js?v=1513f12a39
  - javascripts/gi-cap10-14.js?v=217296d127
  - javascripts/gi-cap7-9.js?v=fdde5b1a77

